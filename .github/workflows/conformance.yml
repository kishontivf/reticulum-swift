name: Conformance Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: Conformance (Swift)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: reticulum-swift-lib

      - uses: actions/checkout@v4
        with:
          repository: torlando-tech/reticulum-conformance
          path: reticulum-conformance

      - uses: actions/checkout@v4
        with:
          repository: markqvist/Reticulum
          path: Reticulum

      - uses: actions/checkout@v4
        with:
          repository: markqvist/LXMF
          path: LXMF

      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm/
          key: spm-conformance-${{ hashFiles('reticulum-swift-lib/Package.swift') }}

      - name: Build conformance bridge and pipe peer
        working-directory: reticulum-swift-lib
        run: |
          swift build -c release --product ConformanceBridge
          swift build -c release --product PipePeer

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install the conformance suite's own declared deps (pytest, msgpack,
      # u-msgpack-python, …) so new harness-side imports don't break collection,
      # plus pytest-timeout for the --timeout cap below. We invoke pytest serially
      # (no -n), so the bundled pytest-xdist is inert here.
      - run: pip install -r reticulum-conformance/requirements.txt pytest-timeout

      - name: Run conformance tests
        working-directory: reticulum-conformance
        env:
          # Per-impl override: the fresh-built Swift bridge is used for
          # swift peers; reference peers fall back to the Python RNS bridge
          # so cross-impl parametrization exercises both stacks.
          CONFORMANCE_SWIFT_BRIDGE_CMD: ${{ github.workspace }}/reticulum-swift-lib/.build/release/ConformanceBridge
          PYTHON_RNS_PATH: ${{ github.workspace }}/Reticulum
          PYTHON_LXMF_PATH: ${{ github.workspace }}/LXMF
        # tests/lxmf/ is the LXMF-layer conformance suite owned by LXMF-swift;
        # it rides the same bridge but has its own CI target. Keep the
        # reticulum-swift CI focused on RNS-layer parity.
        #
        # --timeout=180 caps any individual test that wedges (resource-multihop
        # can hang indefinitely on a failed transfer) so a single hung case
        # doesn't consume the entire workflow budget and timeout-kill the
        # whole run. 180 s tolerates the slowest passing cases:
        # test_large_resource_multihop transfers 256 KB through a 2-hop link
        # and takes ~60-90 s per variant on a macos-15 runner; all 8
        # variants pass reliably at this cap. Previous 60 s cap was too
        # tight and caused 4 of those 8 to fail as "Timeout" instead of
        # completing.
        run: python3 -m pytest tests/ --ignore=tests/lxmf --impl=swift -v --tb=short --timeout=180

      - name: Run integration tests (IFAC pipe)
        working-directory: reticulum-conformance
        env:
          PYTHON_RNS_PATH: ${{ github.workspace }}/Reticulum
        run: >-
          python3 -m pytest integration/ -v --tb=short
          --peer-cmd=${{ github.workspace }}/reticulum-swift-lib/.build/release/PipePeer
