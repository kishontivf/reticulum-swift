# Coverage config.
#
# BLETransport.swift is CoreBluetooth orchestration: CBPeripheral has no public
# initializer and CBCentralManager can't be driven without Bluetooth hardware, so its
# connect/scan path is structurally 0% in headless CI. Faking it would only test the
# mock, not the shipping code, so we exclude it from coverage rather than chase the gate
# with mock-only "coverage". Its pure decision logic (identifier-first matching,
# scan-only detection) IS extracted and unit-tested (RNodeBLEIdentityTests).
ignore:
  - "Sources/ReticulumSwift/Transport/BLETransport.swift"

coverage:
  status:
    patch:
      default:
        # Report new-line coverage but don't fail the PR on it: much of the BLE surface
        # is untestable-by-construction in CI (see ignore above).
        informational: true
